<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GenLayer TweetEvaluator v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--s1:#0d0d16;--s2:#11111c;--s3:#161625;--border:#1f1f30;
  --acc:#7c3aed;--acc2:#a78bfa;--accg:rgba(124,58,237,.12);
  --t1:#e8e8f0;--t2:#9494a8;--t3:#52526a;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;
}
html,body{background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:13px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--s1)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-wrap:nowrap}
.body{flex:1;overflow-y:auto}
.right-pane{padding:20px;max-width:900px}

/* sidebar */
.sb-logo{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sb-hex{width:22px;height:22px;flex-shrink:0}
.sb-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#c4b5fd}
.sb-sub{font-size:9.5px;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-top:2px}
.sb-section{padding:10px 10px 4px;font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.1em}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 12px;cursor:pointer;color:var(--t2);border-left:2px solid transparent;font-size:12px;background:none;border-top:none;border-bottom:none;border-right:none;width:100%;text-align:left;transition:all .1s}
.sb-item:hover{color:var(--t1);background:var(--accg)}
.sb-item.active{color:var(--acc2);border-left-color:var(--acc);background:var(--accg)}
.sb-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600;flex-shrink:0}
.sb-tag.w{background:rgba(239,68,68,.15);color:#f87171}
.sb-tag.r{background:rgba(96,165,250,.12);color:#60a5fa}
.sb-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
.dot-live{background:var(--green);animation:pulse 2s infinite}
.dot-pend{background:var(--amber);animation:pulse .8s infinite}
.dot-err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* topbar */
.tb-mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.tb-addr{color:var(--acc2);background:var(--accg);border:1px solid rgba(124,58,237,.25);padding:3px 8px;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px}
.tb-sep{color:var(--border)}
.net-badge{display:flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 9px;border-radius:5px;margin-left:auto;white-space:nowrap}
.nb-live{color:var(--green);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2)}
.nb-err{color:var(--red);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2)}
.nb-pend{color:var(--amber);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2)}
.fi{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--t1);font-family:'DM Sans',sans-serif;outline:none;width:100%;transition:border-color .12s}
.fi:focus{border-color:rgba(124,58,237,.5)}
.fi::placeholder{color:var(--t3)}
textarea.fi{resize:vertical;line-height:1.6;min-height:90px}
select.fi{cursor:pointer}

/* layout */
.pane-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:3px}
.pane-sub{font-size:11.5px;color:var(--t3);margin-bottom:16px}
.card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card-title{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;border:1px solid transparent}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn-p:hover{background:#6d28d9}
.btn-d{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.25)}.btn-d:hover{background:rgba(239,68,68,.2)}
.btn-s{background:var(--s3);color:var(--t2);border-color:var(--border)}.btn-s:hover{color:var(--t1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-full{width:100%}
.spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:11px}
.stat-lbl{font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.stat-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-top:3px;line-height:1}
.stat-sub{font-size:10px;color:var(--t3);margin-top:2px}
.mono{font-family:'JetBrains Mono',monospace}
.out-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:var(--t2);white-space:pre-wrap;word-break:break-all;max-height:380px;overflow-y:auto}
.out-label{font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:flex;justify-content:space-between}
.copy-btn{cursor:pointer;color:var(--t3);font-size:10px;background:none;border:none;font-family:'JetBrains Mono',monospace}.copy-btn:hover{color:var(--acc2)}
/* verdict */
.verdict-box{display:flex;align-items:flex-start;gap:12px;padding:13px;border-radius:8px;border:1px solid;margin-bottom:10px}
.vb-ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3)}
.vb-no{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.25)}
.v-score{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;line-height:1}
.v-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:4px}
.vb-appr{background:#052e16;color:#4ade80;border:1px solid #166534}
.vb-rejt{background:#300505;color:#f87171;border:1px solid #7f1d1d}
.dim-row{margin-bottom:8px}
.dim-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;color:var(--t2)}
.dim-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.dim-fill{height:100%;border-radius:2px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:500}
.b-edu{background:#1a3a6e22;color:#60a5fa;border:1px solid #1a3a6e55}
.b-com{background:#2e1a6e22;color:#a78bfa;border:1px solid #2e1a6e55}
.b-res{background:#064e3b22;color:#34d399;border:1px solid #064e3b55}
.b-meme{background:#42200622;color:#fbbf24;border:1px solid #42200655}
.b-spam{background:#45000022;color:#f87171;border:1px solid #45000055}
.b-fud{background:#45000022;color:#fca5a5;border:1px solid #45000055}
.b-shill{background:#7c1f0022;color:#fb923c;border:1px solid #7c1f0055}
.hard-rule{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:6px;padding:8px 11px;margin-bottom:9px}
.hr-title{font-size:9.5px;font-weight:600;color:#f87171;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.hr-val{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#fca5a5}
.tx-box{background:var(--bg);border:1px solid rgba(124,58,237,.3);border-radius:7px;padding:10px;margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);line-height:1.7}
.tx-box a{color:var(--acc2);text-decoration:none}.tx-box a:hover{text-decoration:underline}
.loading{display:flex;align-items:center;gap:8px;padding:16px;color:var(--t3);font-size:12px}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px}
.banner-ok{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.25)}
.banner-err{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.25)}
.banner-info{background:var(--s3);border:1px solid var(--border)}

/* samples */
.sample-item{cursor:pointer;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;transition:border-color .12s}
.sample-item:hover{border-color:rgba(124,58,237,.4)}
</style>
</head>
<body>
<div class="shell">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-logo">
    <svg class="sb-hex" viewBox="0 0 26 26" fill="none">
      <polygon points="13,2 24,8 24,18 13,24 2,18 2,8" fill="rgba(124,58,237,.2)" stroke="#7c3aed" stroke-width="1.5"/>
      <polygon points="13,7 20,10.5 20,15.5 13,19 6,15.5 6,10.5" fill="#7c3aed" opacity=".8"/>
    </svg>
    <div><div class="sb-title">GenLayer</div><div class="sb-sub">TweetEvaluator_v3</div></div>
  </div>

  <div class="sb-section">Contract</div>
  <button class="sb-item active" onclick="nav('overview',this)">◈ Overview</button>

  <div class="sb-section">Read</div>
  <button class="sb-item" onclick="nav('get_stats',this)"><span class="sb-tag r">R</span> get_stats</button>
  <button class="sb-item" onclick="nav('get_config',this)"><span class="sb-tag r">R</span> get_config</button>
  <button class="sb-item" onclick="nav('get_count',this)"><span class="sb-tag r">R</span> get_count</button>
  <button class="sb-item" onclick="nav('get_profiles',this)"><span class="sb-tag r">R</span> get_profiles</button>
  <button class="sb-item" onclick="nav('get_profile',this)"><span class="sb-tag r">R</span> get_profile</button>
  <button class="sb-item" onclick="nav('get_evaluation',this)"><span class="sb-tag r">R</span> get_evaluation</button>
  <button class="sb-item" onclick="nav('get_evaluation_by_id',this)"><span class="sb-tag r">R</span> get_evaluation_by_id</button>
  <button class="sb-item" onclick="nav('get_approved_urls',this)"><span class="sb-tag r">R</span> get_approved_urls</button>
  <button class="sb-item" onclick="nav('get_by_category',this)"><span class="sb-tag r">R</span> get_by_category</button>
  <button class="sb-item" onclick="nav('get_category_breakdown',this)"><span class="sb-tag r">R</span> get_category_breakdown</button>
  <button class="sb-item" onclick="nav('get_profile_breakdown',this)"><span class="sb-tag r">R</span> get_profile_breakdown</button>
  <button class="sb-item" onclick="nav('get_hard_rule_breakdown',this)"><span class="sb-tag r">R</span> get_hard_rule_breakdown</button>
  <button class="sb-item" onclick="nav('get_needs_review',this)"><span class="sb-tag r">R</span> get_needs_review</button>

  <button class="sb-item" onclick="nav('get_top_scores',this)"><span class="sb-tag r">R</span> get_top_scores</button>

  <div class="sb-section">Write</div>
  <button class="sb-item" onclick="nav('submit_tweet',this)"><span class="sb-tag w">W</span> submit_tweet</button>
  <button class="sb-item" onclick="nav('submit_tweet_default',this)"><span class="sb-tag w">W</span> submit_tweet_default</button>
  <button class="sb-item" onclick="nav('admin_override',this)"><span class="sb-tag w">W</span> admin_override</button>
  <button class="sb-item" onclick="nav('set_profile_weights',this)"><span class="sb-tag w">W</span> set_profile_weights</button>

  <div class="sb-foot">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)">
      <span class="dot dot-pend" id="foot-dot"></span><span id="foot-status">Init…</span>
    </div>
    <div class="mono" style="font-size:9px;color:var(--t3);margin-top:3px">0x6c1E…dFb93a</div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <span class="tb-mono" style="color:var(--t3)">TweetEvaluator_v3</span>
    <span class="tb-sep">|</span>
    <span class="tb-addr" onclick="copyText('0x6c1Edb34D13CE3B35eCD55B59F0FABC978dFb93a')" title="Copy address">0x6c1E…dFb93a</span>
    <span class="tb-sep">|</span>
    <span style="font-size:11px;color:var(--t3)">Sender:</span>
    <input id="sender-addr" class="fi" style="width:240px;padding:3px 8px;font-size:11px;font-family:'JetBrains Mono',monospace" 
           placeholder="0xYourAddress (for write methods)">
    <div class="net-badge nb-pend" id="net-badge">
      <span class="dot dot-pend" id="net-dot"></span><span id="net-label">Connecting…</span>

<div id="toast" style="display:none;position:fixed;bottom:18px;right:18px;background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:9px 15px;font-size:12px;color:var(--t2);z-index:9999;max-width:340px"></div>

<script type="module">
// ═══════════════════════════════════════════
// IMPORT genlayer-js via ESM CDN
// ═══════════════════════════════════════════
import { createClient, createAccount } from 'https://esm.sh/genlayer-js@latest';
import { simulator } from 'https://esm.sh/genlayer-js@latest/chains';
import { TransactionStatus } from 'https://esm.sh/genlayer-js@latest/types';

// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const CONTRACT  = '0x6c1Edb34D13CE3B35eCD55B59F0FABC978dFb93a';
const EXPLORER  = 'https://explorer-studio.genlayer.com/tx/';
const RPC_URL   = 'https://studio.genlayer.com:8443/api';

// Custom chain config for hosted Studio
const studioChain = {
  ...simulator,
  rpcUrls: {
    default: { http: [RPC_URL] },
    public:  { http: [RPC_URL] },
  },
};

// Client (read-only, no account needed for reads)
let client = null;
let account = null;

function initClient(privKey) {
  const cfg = { chain: studioChain };
  if (privKey) {
    account = createAccount(privKey);
    cfg.account = account;
  }
  client = createClient(cfg);
  return client;
}

// ═══════════════════════════════════════════
// RPC HELPERS
// ═══════════════════════════════════════════
async function glRead(fn, args = []) {
  if (!client) initClient();
  const raw = await client.readContract({
    address: CONTRACT,
    functionName: fn,
    args,
    stateStatus: 'accepted',
  });
  if (typeof raw === 'string') { try { return JSON.parse(raw); } catch { return raw; } }
  return raw;
}

async function glWrite(fn, args = []) {
  const pk = document.getElementById('sender-pk')?.value?.trim();
  if (pk) { initClient(pk); }
  else if (!client) { initClient(); }

  const senderAddr = document.getElementById('sender-addr').value.trim();
  const txHash = await client.writeContract({
    account: account || (senderAddr ? { address: senderAddr } : undefined),
    address: CONTRACT,
    functionName: fn,
    args,
    value: 0n,
  });
  return txHash;
}

async function glWait(txHash) {
  return await client.waitForTransactionReceipt({
    hash: txHash,
    status: TransactionStatus.FINALIZED,
    retries: 60,
    interval: 3000,
  });
}

// ═══════════════════════════════════════════
// CONNECTIVITY CHECK
// ═══════════════════════════════════════════
async function checkConn() {
  setNet('pend', 'Connecting…');
  try {
    initClient();
    const count = await glRead('get_count');
    setNet('live', `Live · ${count} evals`);
    setFoot('live', 'Connected');
  } catch(e) {
    setNet('err', 'RPC Error');
    setFoot('err', 'No connection');
    console.warn('GenLayer:', e.message);
  }
}

function setNet(state, txt) {
  const b = document.getElementById('net-badge');
  const d = document.getElementById('net-dot');
  const l = document.getElementById('net-label');
  b.className = 'net-badge';
  d.className = 'dot';
  if (state==='live'){ b.classList.add('nb-live'); d.classList.add('dot-live'); }
  else if (state==='err'){ b.classList.add('nb-err'); d.classList.add('dot-err'); }
  else { b.classList.add('nb-pend'); d.classList.add('dot-pend'); }
  l.textContent = txt;
}
function setFoot(state, txt) {
  const d = document.getElementById('foot-dot');
  const s = document.getElementById('foot-status');
  d.className = 'dot';
  d.classList.add(state==='live'?'dot-live':state==='err'?'dot-err':'dot-pend');
  s.textContent = txt;
}

// ═══════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════
const DIMS = ['relevance','technical','originality','tone','engagement'];
const DLABELS = {relevance:'Relevance',technical:'Technical Accuracy',originality:'Originality',tone:'Tone Quality',engagement:'Engagement Potential'};
const DCOLORS = {relevance:'#60a5fa',technical:'#34d399',originality:'#a78bfa',tone:'#fbbf24',engagement:'#f87171'};
const CATMAP  = {educational:'b-edu',community:'b-com',research:'b-res',meme:'b-meme',spam:'b-spam',fud:'b-fud',shill:'b-shill'};

window.nav = function(page, btn) {
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  ({
    overview: renderOverview,
    get_stats:()=>renderRead('get_stats',[],null),
    get_config:()=>renderRead('get_config',[],null),
    get_count:()=>renderRead('get_count',[],null),
    get_profiles:()=>renderRead('get_profiles',[],null),
    get_profile:()=>renderReadP('get_profile',[{id:'p-name',label:'name',type:'select',opts:['lenient','moderate','strict']}],v=>[v['p-name']]),
    get_evaluation:()=>renderReadP('get_evaluation',[{id:'p-idx',label:'index (u32)',type:'number',val:'0'}],v=>[parseInt(v['p-idx'])]),
    get_evaluation_by_id:()=>renderReadP('get_evaluation_by_id',[{id:'p-eid',label:'eval_id',type:'text',ph:'paste eval_id'}],v=>[v['p-eid']]),
    get_approved_urls:()=>renderRead('get_approved_urls',[],null),
    get_by_category:()=>renderReadP('get_by_category',[{id:'p-cat',label:'category',type:'select',opts:['educational','community','research','meme','spam','fud','shill']}],v=>[v['p-cat']]),
    get_category_breakdown:()=>renderRead('get_category_breakdown',[],null),
    get_profile_breakdown:()=>renderRead('get_profile_breakdown',[],null),
    get_hard_rule_breakdown:()=>renderRead('get_hard_rule_breakdown',[],null),
    get_needs_review:()=>renderRead('get_needs_review',[],null),
    get_overrides:()=>renderRead('get_overrides',[],null),
    get_top_scores:()=>renderReadP('get_top_scores',[{id:'p-n',label:'n (u8)',type:'number',val:'5'}],v=>[parseInt(v['p-n']||5)]),
    submit_tweet: renderSubmitTweet,
    submit_tweet_default: renderSubmitDefault,
    admin_override: renderAdminOverride,
    set_profile_weights: renderSetWeights,
    set_profile_threshold: renderSetThreshold,
    set_profile_rules: renderSetRules,
    set_default_profile: renderSetDefault,
    toggle_pause: renderTogglePause,
  }[page] || (()=>{}))();
};

// ═══════════════════════════════════════════
// OVERVIEW
// ═══════════════════════════════════════════
async function renderOverview() {
  const rp = document.getElementById('right-pane');
  rp.innerHTML = `<div class="pane-title">Contract Overview</div>
  <div class="pane-sub">GenLayerTweetEvaluator_v3 · <span class="mono" style="color:var(--acc2)">${CONTRACT}</span></div>
  <div class="loading"><span class="spinner"></span> Loading from chain…</div>`;
  try {

function buildResult(ev, txHash) {
  if (!ev) return '<div style="color:var(--t3)">No result data</div>';
  const ok = ev.verdict==='approved';
  const sc = ev.total_score||0;
  const sc_c = sc>=70?'var(--green)':sc>=45?'var(--amber)':'var(--red)';
  const dims = ev.dimensions||{};
  const dimKeys = ['relevance','technical_accuracy','originality','tone_quality','engagement_potential'];
  const dimNames = ['Relevance','Technical','Originality','Tone','Engagement'];
  const dimColors = ['#60a5fa','#34d399','#a78bfa','#fbbf24','#f87171'];
  return `
  <div class="verdict-box ${ok?'vb-ok':'vb-no'}">
    <div>
      <div class="v-badge ${ok?'vb-appr':'vb-rejt'}">${ok?'✓ APPROVED':'✗ REJECTED'}</div>
      <div class="v-score" style="color:${sc_c};margin-top:7px">${sc}<span style="font-size:16px;font-weight:400;color:var(--t3)">/100</span></div>
      <div style="font-size:10px;color:var(--t3);margin-top:2px">profile: ${ev.profile||'—'}</div>
    </div>
    <div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <span class="badge ${CATMAP[ev.category]||'b-edu'}">${ev.category||'—'}</span>
      <span style="font-size:10px;color:var(--t3)">${ev.confidence||'—'}</span>
    </div>
  </div>
  ${ev.hard_rule_triggered?`<div class="hard-rule"><div class="hr-title">Hard Rule</div><div class="hr-val">${ev.hard_rule_triggered}</div></div>`:''}
  ${dimKeys.map((k,i)=>{const v=dims[k]||0;const c=v>=70?'var(--green)':v>=40?'var(--amber)':'var(--red)';return`
  <div class="dim-row">
    <div class="dim-top"><span>${dimNames[i]}</span><span class="mono" style="color:${c}">${v}</span></div>
    <div class="dim-track"><div class="dim-fill" style="width:${v}%;background:${c}"></div></div>
  </div>`}).join('')}
  <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px;margin-top:9px">
    <div style="font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">AI Feedback</div>
    <div style="font-size:12px;color:var(--t2);line-height:1.6">${ev.feedback||'—'}</div>
  </div>
  <div class="tx-box" style="margin-top:9px">
    Eval ID: <span style="color:var(--t1)">${ev.eval_id||'—'}</span><br>
    TX: <a href="${EXPLORER}${txHash}" target="_blank">${txHash}</a>
  </div>`;
}

    () => [document.getElementById('sr-n').value, document.getElementById('sr-b').value, parseInt(document.getElementById('sr-t').value), parseInt(document.getElementById('sr-tone').value)]);
}

function renderSetDefault() {
  renderWrite('set_default_profile',`
    <div class="field"><label>name</label><select class="fi" id="sdp-n"><option>lenient</option><option selected>moderate</option><option>strict</option></select></div>`,
    () => [document.getElementById('sdp-n').value]);
}

function renderTogglePause() {
  renderWrite('toggle_pause', `<div style="font-size:12px;color:var(--t3);margin-bottom:8px">Toggles pause state. Check Overview → Config for current status.</div>`,
    () => []);
  // override btn style
  setTimeout(()=>{const b=document.getElementById('wr-btn');if(b){b.className='btn btn-d btn-full';b.textContent='Toggle Pause';}},50);
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.style.display='block';
  t.style.color = type==='green'?'#4ade80':type==='red'?'#f87171':'var(--t2)';
  t.textContent = msg;
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.style.display='none', 3200);
}

window.copyText = (s) => navigator.clipboard.writeText(s).then(()=>toast('Copied!'));

// expose globals
window.toast = toast;
window.renderOverview = renderOverview;

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
nav('overview', document.querySelector('.sb-item'));
checkConn();
setInterval(checkConn, 30000);
</script>
