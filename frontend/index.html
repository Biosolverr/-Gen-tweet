<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GenLayer TweetEvaluator v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--s1:#0d0d16;--s2:#11111c;--s3:#161625;--border:#1f1f30;--acc:#7c3aed;--acc2:#a78bfa;--accg:rgba(124,58,237,.12);--t1:#e8e8f0;--t2:#9494a8;--t3:#52526a;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
html,body{background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:13px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--s1)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px}
.body{flex:1;overflow-y:auto}
.right-pane{padding:20px;max-width:900px}
.sb-logo{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sb-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#c4b5fd}
.sb-sub{font-size:9.5px;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-top:2px}
.sb-sec{padding:10px 10px 4px;font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.1em}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 12px;cursor:pointer;color:var(--t2);border-left:2px solid transparent;font-size:12px;background:none;border-top:none;border-bottom:none;border-right:none;width:100%;text-align:left;transition:all .1s}
.sb-item:hover{color:var(--t1);background:var(--accg)}
.sb-item.active{color:var(--acc2);border-left-color:var(--acc);background:var(--accg)}
.tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600;flex-shrink:0}
.tag-r{background:rgba(96,165,250,.12);color:#60a5fa}
.tag-w{background:rgba(239,68,68,.15);color:#f87171}
.sb-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.dot-live{background:var(--green);animation:pulse 2s infinite}
.dot-pend{background:var(--amber);animation:pulse .8s infinite}
.dot-err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.mono{font-family:'JetBrains Mono',monospace}
.tb-addr{color:var(--acc2);background:var(--accg);border:1px solid rgba(124,58,237,.25);padding:3px 8px;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px}
.net-badge{display:flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 9px;border-radius:5px;margin-left:auto;white-space:nowrap}
.nb-live{color:var(--green);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2)}
.nb-err{color:var(--red);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2)}
.nb-pend{color:var(--amber);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2)}
.fi{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--t1);font-family:'DM Sans',sans-serif;outline:none;width:100%;transition:border-color .12s}
.fi:focus{border-color:rgba(124,58,237,.5)}
.fi::placeholder{color:var(--t3)}
textarea.fi{resize:vertical;line-height:1.6;min-height:90px}
select.fi{cursor:pointer}
.pane-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:3px}
.pane-sub{font-size:11.5px;color:var(--t3);margin-bottom:16px}
.card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card-title{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;border:1px solid transparent}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn-p:hover{background:#6d28d9}
.btn-d{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.25)}.btn-d:hover{background:rgba(239,68,68,.2)}
.btn-s{background:var(--s3);color:var(--t2);border-color:var(--border)}.btn-s:hover{color:var(--t1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-full{width:100%}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .55s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:11px}
.stat-lbl{font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.stat-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-top:3px;line-height:1}
.stat-sub{font-size:10px;color:var(--t3);margin-top:2px}
.out-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:var(--t2);white-space:pre-wrap;word-break:break-all;max-height:380px;overflow-y:auto}
.out-lbl{font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:flex;justify-content:space-between}
.copy-btn{cursor:pointer;color:var(--t3);font-size:10px;background:none;border:none;font-family:'JetBrains Mono',monospace}.copy-btn:hover{color:var(--acc2)}
.verdict{display:flex;align-items:flex-start;gap:12px;padding:13px;border-radius:8px;border:1px solid;margin-bottom:10px}
.v-ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3)}
.v-no{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.25)}
.v-score{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;line-height:1}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:4px}
.vb-ok{background:#052e16;color:#4ade80;border:1px solid #166534}
.vb-no{background:#300505;color:#f87171;border:1px solid #7f1d1d}
.dim-row{margin-bottom:8px}
.dim-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;color:var(--t2)}
.dim-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.dim-fill{height:100%;border-radius:2px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:500}
.b-edu{background:#1a3a6e22;color:#60a5fa;border:1px solid #1a3a6e55}
.b-com{background:#2e1a6e22;color:#a78bfa;border:1px solid #2e1a6e55}
.b-res{background:#064e3b22;color:#34d399;border:1px solid #064e3b55}
.b-meme{background:#42200622;color:#fbbf24;border:1px solid #42200655}
.b-spam{background:#45000022;color:#f87171;border:1px solid #45000055}
.b-fud{background:#45000022;color:#fca5a5;border:1px solid #45000055}
.b-shill{background:#7c1f0022;color:#fb923c;border:1px solid #7c1f0055}
.hard-rule{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:6px;padding:8px 11px;margin-bottom:9px}
.tx-box{background:var(--bg);border:1px solid rgba(124,58,237,.3);border-radius:7px;padding:10px;margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);line-height:1.7}
.tx-box a{color:var(--acc2);text-decoration:none}.tx-box a:hover{text-decoration:underline}
.loading{display:flex;align-items:center;gap:8px;padding:12px 0;color:var(--t3);font-size:12px}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px}
.b-ok{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.25)}
.b-err{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.25)}
.b-info{background:var(--s3);border:1px solid var(--border)}
.sample-item{cursor:pointer;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;transition:border-color .12s}
.sample-item:hover{border-color:rgba(124,58,237,.4)}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="sb-logo">
    <svg width="22" height="22" viewBox="0 0 26 26" fill="none">
      <polygon points="13,2 24,8 24,18 13,24 2,18 2,8" fill="rgba(124,58,237,.2)" stroke="#7c3aed" stroke-width="1.5"/>
      <polygon points="13,7 20,10.5 20,15.5 13,19 6,15.5 6,10.5" fill="#7c3aed" opacity=".8"/>
    </svg>
    <div><div class="sb-title">GenLayer</div><div class="sb-sub">TweetEvaluator_v3</div></div>
  </div>
  <div class="sb-sec">Contract</div>
  <button class="sb-item active" data-page="overview">◈ Overview</button>
  <div class="sb-sec">Read</div>
  <button class="sb-item" data-page="get_stats"><span class="tag tag-r">R</span>get_stats</button>
  <button class="sb-item" data-page="get_config"><span class="tag tag-r">R</span>get_config</button>
  <button class="sb-item" data-page="get_count"><span class="tag tag-r">R</span>get_count</button>
  <button class="sb-item" data-page="get_profiles"><span class="tag tag-r">R</span>get_profiles</button>
  <button class="sb-item" data-page="get_profile"><span class="tag tag-r">R</span>get_profile</button>
  <button class="sb-item" data-page="get_evaluation"><span class="tag tag-r">R</span>get_evaluation</button>
  <button class="sb-item" data-page="get_evaluation_by_id"><span class="tag tag-r">R</span>get_evaluation_by_id</button>
  <button class="sb-item" data-page="get_approved_urls"><span class="tag tag-r">R</span>get_approved_urls</button>
  <button class="sb-item" data-page="get_by_category"><span class="tag tag-r">R</span>get_by_category</button>
  <button class="sb-item" data-page="get_category_breakdown"><span class="tag tag-r">R</span>get_category_breakdown</button>
  <button class="sb-item" data-page="get_profile_breakdown"><span class="tag tag-r">R</span>get_profile_breakdown</button>
  <button class="sb-item" data-page="get_hard_rule_breakdown"><span class="tag tag-r">R</span>get_hard_rule_breakdown</button>
  <button class="sb-item" data-page="get_needs_review"><span class="tag tag-r">R</span>get_needs_review</button>
  <button class="sb-item" data-page="get_overrides"><span class="tag tag-r">R</span>get_overrides</button>
  <button class="sb-item" data-page="get_top_scores"><span class="tag tag-r">R</span>get_top_scores</button>
  <div class="sb-sec">Write</div>
  <button class="sb-item" data-page="submit_tweet"><span class="tag tag-w">W</span>submit_tweet</button>
  <button class="sb-item" data-page="submit_tweet_default"><span class="tag tag-w">W</span>submit_tweet_default</button>
  <button class="sb-item" data-page="admin_override"><span class="tag tag-w">W</span>admin_override</button>
  <button class="sb-item" data-page="set_profile_weights"><span class="tag tag-w">W</span>set_profile_weights</button>
  <button class="sb-item" data-page="set_profile_threshold"><span class="tag tag-w">W</span>set_profile_threshold</button>
  <button class="sb-item" data-page="set_profile_rules"><span class="tag tag-w">W</span>set_profile_rules</button>
  <button class="sb-item" data-page="set_default_profile"><span class="tag tag-w">W</span>set_default_profile</button>
  <button class="sb-item" data-page="toggle_pause"><span class="tag tag-w">W</span>toggle_pause</button>
  <div class="sb-foot">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)">
      <span class="dot dot-pend" id="foot-dot"></span><span id="foot-status">Init…</span>
    </div>
    <div class="mono" style="font-size:9px;color:var(--t3);margin-top:3px">0x6c1E…dFb93a</div>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <span class="mono" style="font-size:11px;color:var(--t3)">TweetEvaluator_v3</span>
    <span style="color:var(--border)">|</span>
    <span class="tb-addr" id="copy-addr">0x6c1E…dFb93a</span>
    <button class="btn btn-s" id="connect-mm" style="padding:3px 10px;font-size:11px">Connect Wallet</button>
    <span class="mono" id="wallet-addr" style="font-size:10px;color:var(--green);display:none"></span>
    <div class="net-badge nb-pend" id="net-badge">
      <span class="dot dot-pend" id="net-dot"></span><span id="net-label">Connecting…</span>
    </div>
  </div>
  <div class="body"><div class="right-pane" id="pane"></div></div>
</div>
</div>
<div id="toast" style="display:none;position:fixed;bottom:18px;right:18px;background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:9px 15px;font-size:12px;color:var(--t2);z-index:9999;max-width:340px"></div>
<script type="importmap">
{
  "imports": {
    "genlayer-js": "https://esm.sh/genlayer-js@1.1.8",
    "genlayer-js/chains": "https://esm.sh/genlayer-js@1.1.8/chains",
    "genlayer-js/types": "https://esm.sh/genlayer-js@1.1.8/types"
  }
}
</script>
<script type="module">
import { createClient, createAccount } from 'genlayer-js';
import { studionet } from 'genlayer-js/chains';
import { TransactionStatus, ExecutionResult } from 'genlayer-js/types';
const CONTRACT = '0x6c1Edb34D13CE3B35eCD55B59F0FABC978dFb93a';
const EXPLORER = 'https://genlayer-explorer.vercel.app/tx/';
const CATMAP = {educational:'b-edu',community:'b-com',research:'b-res',meme:'b-meme',spam:'b-spam',fud:'b-fud',shill:'b-shill'};
const DIMS_K = ['relevance','technical_accuracy','originality','tone_quality','engagement_potential'];
const DIMS_N = ['Relevance','Technical','Originality','Tone','Engagement'];
const readClient = createClient({ chain: studionet });
let writeClient = null;
let walletConnected = false;
async function glRead(fn, args = []) {
  const result = await readClient.readContract({
    address: CONTRACT,
    functionName: fn,
    args: args.length ? args : undefined,
  });
  if (typeof result === 'string') { try { return JSON.parse(result); } catch { return result; } }
  return result;
}
async function glWrite(fn, args = []) {
  if (!writeClient) {
    if (window.ethereum) {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      writeClient = createClient({
        chain: studionet,
        account: accounts[0],
        provider: window.ethereum,
      });
    } else {
      const account = createAccount();
      writeClient = createClient({ chain: studionet, account });
    }
  }
  const txHash = await writeClient.writeContract({
    address: CONTRACT,
    functionName: fn,
    args: args,
    value: BigInt(0),
  });
  return txHash;
}
async function glWait(txHash, maxMs = 180000) {
  const t0 = Date.now();
  while (Date.now() - t0 < maxMs) {
    try {
      const receipt = await readClient.waitForTransactionReceipt({
        hash: txHash,
        status: TransactionStatus.FINALIZED,
      });
      return receipt;
    } catch {}
    await new Promise(r => setTimeout(r, 3500));
  }
  throw new Error('Timeout: consensus took too long');
}
async function checkConn() {
  setNet('pend','Connecting…');
  try {
    const n = await glRead('get_count');
    setNet('live', `Live · ${n} evals`);
    setFoot('live','Connected');
  } catch(e) {
    setNet('err','RPC Error');
    setFoot('err','No connection');
  }
}
function setNet(s,t){
  const b=document.getElementById('net-badge');
  const d=document.getElementById('net-dot');
  b.className='net-badge '+(s==='live'?'nb-live':s==='err'?'nb-err':'nb-pend');
  d.className='dot '+(s==='live'?'dot-live':s==='err'?'dot-err':'dot-pend');
  document.getElementById('net-label').textContent=t;
}
function setFoot(s,t){
  document.getElementById('foot-dot').className='dot '+(s==='live'?'dot-live':s==='err'?'dot-err':'dot-pend');
  document.getElementById('foot-status').textContent=t;
}
document.getElementById('sidebar').addEventListener('click', e => {
  const btn = e.target.closest('[data-page]');
  if (!btn) return;
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  PAGES[btn.dataset.page]?.();
});
document.getElementById('copy-addr').addEventListener('click', () =>
  navigator.clipboard.writeText(CONTRACT).then(()=>toast('Copied!')));
document.getElementById('connect-mm').addEventListener('click', async () => {
  if (!window.ethereum) { toast('MetaMask not found','red'); return; }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const addr = accounts[0];
    writeClient = createClient({ chain: studionet, account: addr, provider: window.ethereum });
    walletConnected = true;
    document.getElementById('wallet-addr').textContent = addr.slice(0,6)+'…'+addr.slice(-4);
    document.getElementById('wallet-addr').style.display = 'inline';
    document.getElementById('connect-mm').textContent = 'Connected';
    document.getElementById('connect-mm').disabled = true;
    toast('Wallet connected ✓','green');
  } catch(e) { toast(e.message,'red'); }
});
function pane(html){ document.getElementById('pane').innerHTML = html; }
function toast(msg,type){
  const t=document.getElementById('toast');
  t.style.display='block';
  t.style.color=type==='green'?'#4ade80':type==='red'?'#f87171':'var(--t2)';
  t.textContent=msg;
  clearTimeout(window.__tt);
  window.__tt=setTimeout(()=>t.style.display='none',3200);
}
function kv(obj){return Object.entries(obj).map(([k,v])=>`
  <div style="display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--border)">
    <span style="color:var(--t3)">${k}</span><span class="mono" style="color:var(--t1)">${v}</span>
  </div>`).join('');}
async function pageOverview() {
  pane(`<div class="pane-title">Contract Overview</div>
    <div class="pane-sub mono" style="font-size:10px;color:var(--acc2)">${CONTRACT}</div>
    <div class="loading"><span class="spin"></span> Loading from chain…</div>`);
  try {
    const [s,c,pr] = await Promise.all([glRead('get_stats'),glRead('get_config'),glRead('get_profiles')]);
    const stats=s||{}, cfg=c||{}, profiles=Array.isArray(pr)?pr:[];
    pane(`<div class="pane-title">Contract Overview</div>
    <div class="pane-sub mono" style="font-size:10px;color:var(--acc2)">${CONTRACT}</div>
    <div class="banner b-ok"><span style="color:var(--green)">●</span><span style="color:var(--t2)">Connected · Live data from GenLayer Studio</span>
      <button class="btn btn-s" style="margin-left:auto;padding:2px 9px;font-size:11px" data-page="overview">↻ Refresh</button></div>
    <div class="g4" style="margin-bottom:12px">
      <div class="stat"><div class="stat-lbl">Evaluations</div><div class="stat-val">${stats.total||0}</div><div class="stat-sub">${profiles.length} profiles</div></div>
      <div class="stat"><div class="stat-lbl">Approved</div><div class="stat-val" style="color:var(--green)">${stats.approved||0}</div><div class="stat-sub">${stats.total?Math.round((stats.approved||0)/stats.total*100):0}%</div></div>
      <div class="stat"><div class="stat-lbl">Rejected</div><div class="stat-val" style="color:var(--red)">${stats.rejected||0}</div><div class="stat-sub">${stats.hard_rule_rejections||0} hard rules</div></div>
      <div class="stat"><div class="stat-lbl">Avg Score</div><div class="stat-val" style="color:var(--acc2)">${stats.avg_total_score||0}</div></div>
    </div>
    <div class="g2" style="margin-bottom:12px">
      <div class="card"><div class="card-title">Config</div>${kv({'Owner':cfg.owner||'—','Paused':cfg.paused?'⚠ YES':'No','Default':cfg.default_profile||'—','Total':cfg.total_evaluations||0})}</div>
      <div class="card"><div class="card-title">Profiles</div>${profiles.map(p=>`
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
          <span style="width:7px;height:7px;border-radius:50%;background:${p.name==='lenient'?'#10b981':p.name==='strict'?'#ef4444':'#7c3aed'}"></span>
          <span style="font-weight:500">${p.name}</span>
          <span style="color:var(--t3);font-size:11px">thr <span class="mono">${p.threshold}</span></span>
          ${p.is_default?'<span style="font-size:9px;background:var(--accg);color:var(--acc2);border:1px solid rgba(124,58,237,.25);padding:1px 5px;border-radius:3px;margin-left:auto">default</span>':''}
        </div>`).join('')}</div>
    </div>
    <div class="card"><div class="card-title">Quick Actions</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-p" data-page="submit_tweet">⊕ Submit Tweet</button>
        <button class="btn btn-s" data-page="get_stats">Get Stats</button>
        <button class="btn btn-s" data-page="get_profiles">Get Profiles</button>
        <button class="btn btn-s" data-page="get_needs_review">Needs Review</button>
      </div></div>`);
  } catch(e) {
    document.getElementById('pane').insertAdjacentHTML('beforeend',
      `<div class="banner b-err"><span style="color:var(--red)">✕</span><span style="color:var(--t2)">${e.message}</span>
       <button class="btn btn-s" style="margin-left:auto;padding:2px 9px;font-size:11px" data-page="overview">Retry</button></div>`);
  }
}
function pageRead(fn) {
  pane(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
    <span class="tag tag-r">Read</span><div class="pane-title" style="margin:0">${fn}</div></div>
  <div class="pane-sub">No parameters</div>
  <div class="card"><button class="btn btn-p" id="call-btn">Call Contract</button></div>
  <div class="card" style="display:none" id="out-card">
    <div class="out-lbl"><span>Return Value</span><button class="copy-btn" id="copy-out">Copy</button></div>
    <div class="out-box" id="out-box"></div></div>`);
  document.getElementById('call-btn').onclick = async () => {
    const btn = document.getElementById('call-btn');
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    document.getElementById('out-card').style.display='block';
    try {
      const r = await glRead(fn);
      document.getElementById('out-box').textContent = typeof r==='object'?JSON.stringify(r,null,2):String(r);
    } catch(e) { document.getElementById('out-box').innerHTML=`<span style="color:var(--red)">${e.message}</span>`; }
    btn.disabled=false; btn.textContent='Call Contract';
  };
  document.getElementById('copy-out').onclick = () =>
    navigator.clipboard.writeText(document.getElementById('out-box').textContent).then(()=>toast('Copied!'));
}
function pageReadP(fn, fieldsHTML, getArgs) {
  pane(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
    <span class="tag tag-r">Read</span><div class="pane-title" style="margin:0">${fn}</div></div>
  <div class="card"><div class="card-title">Parameters</div>${fieldsHTML}
    <div style="margin-top:8px"><button class="btn btn-p" id="call-btn">Call Contract</button></div></div>
  <div class="card" style="display:none" id="out-card">
    <div class="out-lbl"><span>Return Value</span><button class="copy-btn" id="copy-out">Copy</button></div>
    <div class="out-box" id="out-box"></div></div>`);
  document.getElementById('call-btn').onclick = async () => {
    const btn=document.getElementById('call-btn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
    document.getElementById('out-card').style.display='block';
    try { const r=await glRead(fn,getArgs()); document.getElementById('out-box').textContent=typeof r==='object'?JSON.stringify(r,null,2):String(r); }
    catch(e){ document.getElementById('out-box').innerHTML=`<span style="color:var(--red)">${e.message}</span>`; }
    btn.disabled=false;btn.textContent='Call Contract';
  };
  document.getElementById('copy-out').onclick = () =>
    navigator.clipboard.writeText(document.getElementById('out-box').textContent).then(()=>toast('Copied!'));
}
function pageWrite(fn, fieldsHTML, getArgs, danger) {
  pane(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
    <span class="tag tag-w">Write</span><div class="pane-title" style="margin:0">${fn}</div></div>
  <div class="card">${fieldsHTML}
    <button class="${danger?'btn btn-d':'btn btn-p'} btn-full" style="margin-top:10px" id="wr-btn">Send Transaction</button></div>
  <div class="card" style="display:none" id="wr-res"><div class="card-title">Result</div><div id="wr-out"></div></div>`);
  document.getElementById('wr-btn').onclick = async () => {
    const btn=document.getElementById('wr-btn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
    try {
      const args=getArgs();
      const txHash=await glWrite(fn,args);
      document.getElementById('wr-res').style.display='block';
      document.getElementById('wr-out').innerHTML=`<div class="tx-box" style="border-color:rgba(16,185,129,.3)">✓ TX: <a href="${EXPLORER}${txHash}" target="_blank">${txHash}</a></div>`;
      toast('Sent ✓','green');
    } catch(e){ document.getElementById('wr-res').style.display='block';document.getElementById('wr-out').innerHTML=`<span style="color:var(--red)">${e.message}</span>`;toast(e.message,'red'); }
    btn.disabled=false;btn.textContent='Send Transaction';
  };
}
function buildResult(ev, txHash) {
  if(!ev) return '<div style="color:var(--t3)">No result data</div>';
  const ok=ev.verdict==='approved';
  const sc=ev.total_score||0;
  const sc_c=sc>=70?'var(--green)':sc>=45?'var(--amber)':'var(--red)';
  const dims=ev.dimensions||{};
  return `
  <div class="verdict ${ok?'v-ok':'v-no'}">
    <div><div class="vbadge ${ok?'vb-ok':'vb-no'}">${ok?'✓ APPROVED':'✗ REJECTED'}</div>
      <div class="v-score" style="color:${sc_c};margin-top:7px">${sc}<span style="font-size:16px;font-weight:400;color:var(--t3)">/100</span></div>
      <div style="font-size:10px;color:var(--t3);margin-top:2px">profile: ${ev.profile||'—'}</div></div>
    <div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <span class="badge ${CATMAP[ev.category]||'b-edu'}">${ev.category||'—'}</span>
      <span style="font-size:10px;color:var(--t3)">${ev.confidence||'—'}</span>
    </div>
  </div>
  ${ev.hard_rule_triggered?`<div class="hard-rule"><div style="font-size:9.5px;font-weight:600;color:#f87171;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Hard Rule</div><div class="mono" style="font-size:11.5px;color:#fca5a5">${ev.hard_rule_triggered}</div></div>`:''}
  ${DIMS_K.map((k,i)=>{const v=dims[k]||0;const c=v>=70?'var(--green)':v>=40?'var(--amber)':'var(--red)';return`
  <div class="dim-row"><div class="dim-top"><span>${DIMS_N[i]}</span><span class="mono" style="color:${c}">${v}</span></div>
  <div class="dim-track"><div class="dim-fill" style="width:${v}%;background:${c}"></div></div></div>`}).join('')}
  <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px;margin-top:9px">
    <div style="font-size:9.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">AI Feedback</div>
    <div style="font-size:12px;color:var(--t2);line-height:1.6">${ev.feedback||'—'}</div>
  </div>
  <div class="tx-box">Eval ID: <span style="color:var(--t1)">${ev.eval_id||'—'}</span><br>TX: <a href="${EXPLORER}${txHash}" target="_blank">${txHash}</a></div>`;
}
const SAMPLES=[
  {url:'https://x.com/researcher/status/001',text:"Deep dive into GenLayer's Equivalence Principle — heterogeneous AI validators reaching deterministic consensus. Full benchmark data. 10M test cases, zero failures. 🧵",cat:'research',hint:'High score'},
  {url:'https://x.com/genlayer/status/002',text:"🚀 GenLayer Testnet: 394 validators live. Optimistic Democracy consensus time down 40%. Stability under adversarial conditions confirmed.",cat:'community',hint:'Community'},
  {url:'https://x.com/memer/status/004',text:"GenLayer validators when tweet is slightly ambiguous 😭 [three validators arguing: APPROVED / REJECTED / idk lol]",cat:'meme',hint:'Meme · banned in strict'},
  {url:'https://x.com/fudder/status/005',text:"GenLayer is vaporware. No real users, no real validators. 'Equivalence Principle' is just marketing BS.",cat:'fud',hint:'FUD · hard reject'},
  {url:'https://x.com/spambot/status/006',text:"🚨 FREE TOKENS 🚨 Follow + RT + wallet. GenLayer airdrop NOW. Limited 1000 spots!!!! 💰💰💰",cat:'spam',hint:'Spam · hard reject'},
];
function pageSubmitTweet() {
  pane(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
    <span class="tag tag-w">Write</span><div class="pane-title" style="margin:0">submit_tweet</div></div>
  <div class="pane-sub">Submit tweet for AI evaluation</div>
  <div style="display:grid;grid-template-columns:1fr 270px;gap:12px;align-items:start">
    <div>
      <div class="card">
        <div class="field"><label>tweet_url</label><input class="fi" id="st-url" value="https://x.com/genlayer/status/1234"></div>
        <div class="field"><label>tweet_text</label>
          <textarea class="fi" id="st-text" rows="6">Just published a deep dive into GenLayer's Equivalence Principle — heterogeneous AI validators reaching deterministic consensus. Benchmark data included. 🧵</textarea></div>
        <div class="field"><label>profile (пусто = default)</label>
          <select class="fi" id="st-prof"><option value="">— Default —</option><option>lenient</option><option>moderate</option><option>strict</option></select></div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn btn-p" id="st-btn">Send Transaction</button>
          <button class="btn btn-s" id="st-sample">Load sample</button>
        </div>
      </div>
      <div class="card" style="display:none" id="st-res-card"><div class="card-title">Result</div><div id="st-res"></div></div>
    </div>
    <div class="card"><div class="card-title">Samples</div>
      ${SAMPLES.map((s,i)=>`<div class="sample-item" data-si="${i}">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span class="badge ${CATMAP[s.cat]||'b-edu'}">${s.cat}</span>
          <span style="font-size:10px;color:var(--t3)">${s.hint}</span>
        </div>
        <div style="font-size:11.5px;color:var(--t2);line-height:1.5">${s.text.slice(0,75)}…</div>
      </div>`).join('')}
    </div>
  </div>`);
  document.querySelectorAll('[data-si]').forEach(el => {
    el.addEventListener('click', () => {
      const s = SAMPLES[+el.dataset.si];
      document.getElementById('st-url').value = s.url;
      document.getElementById('st-text').value = s.text;
    });
  });
  document.getElementById('st-sample').onclick = () => {
    const s = SAMPLES[Math.floor(Math.random()*SAMPLES.length)];
    document.getElementById('st-url').value = s.url;
    document.getElementById('st-text').value = s.text;
  };
  document.getElementById('st-btn').onclick = async () => {
    const url = document.getElementById('st-url').value.trim();
    const text = document.getElementById('st-text').value.trim();
    const prof = document.getElementById('st-prof').value;
    if (!url||!text) { toast('URL и текст обязательны','red'); return; }
    const btn = document.getElementById('st-btn');
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> Sending…';
    try {
      const fn = prof ? 'submit_tweet' : 'submit_tweet_default';
      const args = prof ? [url,text,prof] : [url,text];
      const txHash = await glWrite(fn, args);
      btn.innerHTML = '<span class="spin"></span> Consensus…';
      const card = document.getElementById('st-res-card');
      card.style.display='block';
      document.getElementById('st-res').innerHTML = `<div class="tx-box">TX: <a href="${EXPLORER}${txHash}" target="_blank">${txHash}</a>
        <div class="loading"><span class="spin"></span> Validators evaluating…</div></div>`;
      await glWait(txHash);
      const count = await glRead('get_count');
      if (count > 0) {
        const ev = await glRead('get_evaluation',[count-1]);
        document.getElementById('st-res').innerHTML = buildResult(typeof ev==='string'?JSON.parse(ev):ev, txHash);
      } else {
        document.getElementById('st-res').innerHTML = `<div class="tx-box" style="border-color:rgba(16,185,129,.3);color:var(--green)">✓ Finalized · <a href="${EXPLORER}${txHash}" target="_blank">${txHash}</a></div>`;
      }
      toast('Submitted ✓','green');
    } catch(e) {
      document.getElementById('st-res-card').style.display='block';
      document.getElementById('st-res').innerHTML=`<div style="color:var(--red);padding:10px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:7px">${e.message}</div>`;
      toast(e.message,'red');
    }
    btn.disabled=false; btn.textContent='Send Transaction';
  };
}

    ()=>{const w=['relevance','technical','originality','tone','engagement'].map(d=>parseInt(document.getElementById('sw-'+d).value||0));if(w.reduce((a,b)=>a+b,0)!==100)throw new Error('Weights must sum to 100');return[document.getElementById('sw-n').value,...w];}),
